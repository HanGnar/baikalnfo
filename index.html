<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 이 줄이 없으면 모바일이 화면을 980px로 가정하고 축소해서 그린다.
     viewport-fit=cover 가 있어야 노치 영역(safe-area-inset)도 인식된다. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- 개발 중에는 브라우저가 옛 화면을 붙잡지 않도록 캐시를 끈다 -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<!-- 브라우저 상하단 색을 앱 배경과 맞춘다 -->
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

<!-- 홈 화면에 추가했을 때 주소창 없이 전체화면으로 열리게 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="바이칼 서현점">

<title>바이칼 휘트니스 서현점 — 근무 관리</title>

<style>
  /* Pretendard 가변폰트 (동적 서브셋) — 폰·타 기기용.
     맥에는 로컬 설치본이 있어 그쪽이 먼저 잡힌다. */
  @import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css");

  /* ============================================================
     TOKENS — Apple iOS 디자인 시스템
     ============================================================ */
  :root {
    /* 배경 */
    --bg-grouped:  #F2F2F7;   /* systemGroupedBackground */
    --bg-cell:     #FFFFFF;   /* secondarySystemGroupedBackground */
    --bg-cell-2:   #F2F2F7;   /* tertiarySystemGroupedBackground */
    --bg-nav:      rgba(242, 242, 247, .82);
    --fill-4:      rgba(116, 116, 128, .08);  /* quaternarySystemFill */

    /* 텍스트 */
    --label:    #000000;
    --label-2:  rgba(60, 60, 67, .60);
    --label-3:  rgba(60, 60, 67, .30);

    /* 구분선 */
    --separator: rgba(60, 60, 67, .29);
    --sep-opaque: #C6C6C8;

    /* 시스템 컬러 */
    --blue:   #007AFF;
    --green:  #34C759;
    --red:    #FF3B30;
    --orange: #FF9500;
    --pink:   #FF2D55;
    --gray:   #8E8E93;
    --gray-3: #C7C7CC;

    /* 의미 배정 */
    --st-ok:     var(--green);   /* 정상 */
    --st-lost:   var(--red);     /* 분실 */
    --st-broken: var(--orange);  /* 고장 */
    --st-etc:    var(--blue);    /* 기타 */
    --male:      var(--blue);
    --female:    var(--pink);

    /* 타이포 — 자간 -2% 통일, 타이틀 130% / 본문 160% */
    --sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
            "Apple SD Gothic Neo", system-ui, "Segoe UI", Roboto, sans-serif;
    --tracking: -0.02em;
    --lh-title: 1.3;
    --lh-body:  1.6;

    --r-card: 12px;   /* iOS inset grouped */
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-grouped: #000000;
      --bg-cell:    #1C1C1E;
      --bg-cell-2:  #2C2C2E;
      --bg-nav:     rgba(22, 22, 24, .82);
      --fill-4:     rgba(118, 118, 128, .18);

      --label:   #FFFFFF;
      --label-2: rgba(235, 235, 245, .60);
      --label-3: rgba(235, 235, 245, .30);

      --separator:  rgba(84, 84, 88, .65);
      --sep-opaque: #38383A;

      --blue:   #0A84FF;
      --green:  #30D158;
      --red:    #FF453A;
      --orange: #FF9F0A;
      --pink:   #FF375F;
      --gray:   #8E8E93;
      --gray-3: #48484A;
    }
  }

  :root[data-theme="dark"] {
    --bg-grouped: #000000;
    --bg-cell:    #1C1C1E;
    --bg-cell-2:  #2C2C2E;
    --bg-nav:     rgba(22, 22, 24, .82);
    --fill-4:     rgba(118, 118, 128, .18);
    --label:   #FFFFFF;
    --label-2: rgba(235, 235, 245, .60);
    --label-3: rgba(235, 235, 245, .30);
    --separator:  rgba(84, 84, 88, .65);
    --sep-opaque: #38383A;
    --blue:   #0A84FF;
    --green:  #30D158;
    --red:    #FF453A;
    --orange: #FF9F0A;
    --pink:   #FF375F;
    --gray:   #8E8E93;
    --gray-3: #48484A;
  }

  :root[data-theme="light"] {
    --bg-grouped: #F2F2F7;
    --bg-cell:    #FFFFFF;
    --bg-cell-2:  #F2F2F7;
    --bg-nav:     rgba(242, 242, 247, .82);
    --fill-4:     rgba(116, 116, 128, .08);
    --label:   #000000;
    --label-2: rgba(60, 60, 67, .60);
    --label-3: rgba(60, 60, 67, .30);
    --separator:  rgba(60, 60, 67, .29);
    --sep-opaque: #C6C6C8;
    --blue:   #007AFF;
    --green:  #34C759;
    --red:    #FF3B30;
    --orange: #FF9500;
    --pink:   #FF2D55;
    --gray:   #8E8E93;
    --gray-3: #C7C7CC;
  }

  /* ============================================================
     BASE
     ============================================================ */
  * { box-sizing: border-box; }

  body {
    margin: 0;
    overflow: hidden;          /* 문서는 스크롤하지 않는다 — 앱 안쪽만 스크롤 */
    overscroll-behavior: none; /* 고무줄 튕김 방지 */
    background: var(--bg-grouped);
    color: var(--label);
    font-family: var(--sans);
    font-size: 17px;                 /* iOS Body */
    line-height: var(--lh-body);     /* 본문 160% */
    letter-spacing: var(--tracking); /* 자간 -2% 통일 */
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }

  button {
    font: inherit;
    letter-spacing: inherit;
    color: inherit;
    border: 0;
    background: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  h1, h2, h3, p, ul { margin: 0; }
  ul { list-style: none; padding: 0; }

  /* 타이틀 계열 — 행간 130% */
  h1, h2, h3,
  .num, .cell-title, .card-who, .tab, .stat-num, .btn-filled {
    line-height: var(--lh-title);
  }

  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }

  .tnum { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

  /* ============================================================
     APP SHELL — 모바일 화면 그 자체. 화면은 고정, 콘텐츠만 스크롤.
     ============================================================ */
  .app {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: var(--bg-grouped);
    padding-top: env(safe-area-inset-top);
  }

  /* 폰에서는 무조건 꽉 채우고, 넓은 화면에서만 폭을 제한한다 */
  @media (min-width: 600px) {
    .app { max-width: 430px; margin: 0 auto; }
  }

  /* ---------- 네비게이션 바 (iOS Large Title) ---------- */
  .navbar {
    flex: none;
    position: relative;
    z-index: 20;
    height: 44px;
    display: grid;
    grid-template-columns: 44px 1fr 44px;
    align-items: center;
    padding: 0 12px;
    background: var(--bg-nav);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: .5px solid transparent;
    transition: border-color .25s ease;
  }
  .navbar.is-stuck { border-bottom-color: var(--separator); }

  .nav-logo { width: 26px; height: 30px; display: block; }

  .nav-title {
    text-align: center;
    font-size: 17px;
    font-weight: 600;
    opacity: 0;
    transform: translateY(3px);
    transition: opacity .25s ease, transform .25s ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .navbar.is-stuck .nav-title { opacity: 1; transform: none; }

  .nav-btn {
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    color: var(--blue);
    position: relative;
    justify-self: end;
    margin-right: -6px;
  }
  /* ---------- Large Title 영역 ---------- */
  .scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 0 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 30px;
  }

  .large-head { padding: 6px 0 4px; }

  .large-title {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0;
    font-size: 28px;      /* iOS Title 1 */
    font-weight: 700;
    max-width: 100%;
  }
  .large-title span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .large-title svg { color: var(--gray); flex: none; margin-top: 3px; }

  .large-sub {
    margin-top: 2px;
    font-size: 15px;      /* iOS Subhead */
    color: var(--label-2);
  }

  /* ---------- 섹션 ---------- */
  .sec-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }
  .sec-title {
    font-size: 20px;      /* iOS Title 3 */
    font-weight: 700;
  }
  .sec-link {
    padding: 0;
    display: flex;
    align-items: center;
    gap: 2px;
    font-size: 15px;
    color: var(--blue);
    flex: none;
  }
  .sec-link:active { opacity: .4; }

  /* ============================================================
     키 현황 카드
     ============================================================ */
  .key-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .key-card {
    background: var(--bg-cell);
    border-radius: var(--r-card);
    padding: 14px 14px 12px;
    text-align: left;
    transition: opacity .15s ease;
  }
  .key-card:active { opacity: .6; }

  .card-who {
    font-size: 17px;      /* iOS Headline */
    font-weight: 600;
    color: var(--c);
  }
  .card-range {
    font-size: 15px;
    color: var(--label-2);
  }
  .card-total {
    margin-top: 2px;
    display: flex;
    align-items: baseline;
    gap: 2px;
  }
  .card-total .num {
    font-size: 32px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .card-total .unit {
    font-size: 15px;
    font-weight: 600;
    color: var(--label-2);
  }

  .breakdown {
    margin-top: 11px;
    padding-top: 10px;
    border-top: .5px solid var(--separator);
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .breakdown li {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 15px;
    line-height: 1.3;
  }
  .breakdown i {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--d);
    flex: none;
  }
  .breakdown .l { color: var(--label-2); flex: 1; }
  .breakdown .v { font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---------- iOS 채움 버튼 ---------- */
  .btn-filled {
    margin-top: 10px;
    width: 100%;
    min-height: 50px;
    border-radius: var(--r-card);
    background: var(--blue);
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: opacity .15s ease;
  }
  .btn-filled:active { opacity: .7; }

  /* ---------- 전체 합계 ---------- */
  .total-cell .cell-title { font-weight: 600; }
  .total-value { font-size: 17px; font-weight: 600; }
  .cell + .stats { border-top: .5px solid var(--separator); }

  /* .stats(3칸)·.cell 이 파일 뒤쪽에 있어 덮어쓰므로 선택자를 겹쳐 우선순위를 올린다 */
  .stats.stats-4 { grid-template-columns: repeat(4, 1fr); }
  .stats-4 .stat { padding: 9px 3px 8px; }
  .stats-4 .stat-num { font-size: 20px; line-height: 1.2; }
  .stats-4 .stat-label { font-size: 11.5px; line-height: 1.25; }
  .stats-4 .stat + .stat::before { top: 9px; bottom: 9px; }

  /* 상단 '전체 키 / 407개' 줄도 함께 낮춘다 */
  .cell.total-cell { min-height: 40px; padding-top: 8px; padding-bottom: 8px; }

  /* ---------- 빈 상태 ---------- */
  .empty {
    padding: 26px 20px;
    text-align: center;
    font-size: 15px;
    color: var(--label-2);
  }

  /* ============================================================
     등록 시트 (iOS Sheet)
     ============================================================ */
  .scrim {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, .4);
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s ease;
    z-index: 70;
  }
  .scrim.is-open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    max-height: 92%;
    display: flex;
    flex-direction: column;
    background: var(--bg-grouped);
    border-radius: 14px 14px 0 0;
    transform: translateY(101%);
    transition: transform .42s cubic-bezier(.32, .72, 0, 1);
    z-index: 80;
  }
  .sheet.is-open { transform: none; }

  .sheet-bar {
    flex: none;
    display: grid;
    grid-template-columns: 30px 1fr 30px;
    align-items: center;
    gap: 8px;
    padding: 14px 16px 12px;
  }
  .sheet-bar .title {
    grid-column: 2;
    text-align: center;
    font-size: 17px;
    font-weight: 600;
  }

  /* 닫기 X */
  .sheet-close {
    width: 30px; height: 30px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--fill-4);
    color: var(--label-2);
    padding: 0;
    transition: opacity .15s ease;
  }
  .sheet-close:active { opacity: .5; }

  .sheet-body {
    overflow-y: auto;
    padding: 4px 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* 하단 등록 버튼 */
  .sheet-foot {
    flex: none;
    padding: 8px 16px calc(14px + env(safe-area-inset-bottom));
  }
  .btn-submit {
    width: 100%;
    min-height: 50px;
    border-radius: var(--r-card);
    background: var(--blue);
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    line-height: 1.3;
    transition: opacity .15s ease, background-color .15s ease;
  }
  .btn-submit:disabled { background: var(--fill-4); color: var(--label-3); }
  .btn-submit:not(:disabled):active { opacity: .7; }

  /* 등록 완료 알림 */
  .toast {
    position: absolute;
    left: 16px; right: 16px;
    bottom: calc(70px + env(safe-area-inset-bottom));
    z-index: 90;
    padding: 12px 16px;
    border-radius: var(--r-card);
    background: rgba(28, 28, 30, .94);
    color: #fff;
    font-size: 15px;
    text-align: center;
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
    transition: opacity .28s ease, transform .28s ease;
  }
  .toast.is-on { opacity: 1; transform: none; }

  /* 기록 목록의 상태 점 */
  .log-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    flex: none;
  }

  .field-label {
    font-size: 13px;
    color: var(--label-2);
    padding: 0 4px 6px;
  }
  .field-label .optional {
    margin-left: 5px;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--fill-4);
    font-size: 11px;
    color: var(--label-3);
    letter-spacing: 0;
  }

  /* 메모 (선택 입력) */
  .memo-field {
    background: var(--bg-cell);
    border-radius: var(--r-card);
    padding: 11px 16px 9px;
  }
  .memo-field textarea {
    display: block;
    width: 100%;
    min-height: 62px;
    border: 0;
    padding: 0;
    background: none;
    font: inherit;
    letter-spacing: inherit;
    font-size: 17px;
    line-height: var(--lh-body);
    color: var(--label);
    resize: none;
    outline: none;
  }
  .memo-field textarea::placeholder { color: var(--label-3); }

  .memo-count {
    padding: 5px 4px 0;
    text-align: right;
    font-size: 12px;
    color: var(--label-3);
    font-variant-numeric: tabular-nums;
  }

  /* iOS 세그먼티드 컨트롤 */
  .segmented {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
    padding: 2px;
    border-radius: 9px;
    background: rgba(118, 118, 128, .12);
  }
  .segmented button {
    height: 32px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    color: var(--label);
    transition: background-color .2s ease;
  }
  .segmented button[aria-pressed="true"] {
    background: var(--bg-cell);
    box-shadow: 0 3px 8px rgba(0, 0, 0, .12), 0 3px 1px rgba(0, 0, 0, .04);
  }

  /* 번호 입력 */
  .num-field {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-cell);
    border-radius: var(--r-card);
    padding: 0 16px;
    min-height: 50px;
  }
  .num-field input {
    flex: 1;
    min-width: 0;
    border: 0;
    background: none;
    font: inherit;
    letter-spacing: inherit;
    font-size: 17px;
    font-variant-numeric: tabular-nums;
    color: var(--label);
    padding: 13px 0;
    outline: none;
  }
  .num-field input::placeholder { color: var(--label-3); }
  .num-field .hint { font-size: 15px; color: var(--label-2); flex: none; }

  .field-error {
    font-size: 13px;
    color: var(--red);
    padding: 6px 4px 0;
    display: none;
  }
  .field-error.is-on { display: block; }

  /* 상태 선택 */
  .pick .cell { cursor: pointer; }
  .pick .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--c);
    flex: none;
  }
  .pick .check { color: var(--blue); flex: none; opacity: 0; }
  .pick .cell[aria-pressed="true"] .check { opacity: 1; }

  /* ============================================================
     Inset Grouped 리스트
     ============================================================ */
  .group {
    background: var(--bg-cell);
    border-radius: var(--r-card);
    overflow: hidden;
  }

  .cell {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 44px;
    padding: 11px 16px;
    text-align: left;
    transition: background-color .15s ease;
  }
  .cell + .cell::before {
    content: "";
    position: absolute;
    left: 16px; right: 0; top: 0;
    height: .5px;
    background: var(--separator);
  }
  .cell.has-icon + .cell.has-icon::before { left: 51px; }
  button.cell:active { background: var(--fill-4); }

  .cell-ico { width: 27px; display: grid; place-items: center; flex: none; color: var(--c, var(--gray)); }

  .cell-body { flex: 1; min-width: 0; }
  .cell-title {
    font-size: 17px;
    font-weight: 400;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cell-sub {
    font-size: 13px;      /* iOS Footnote */
    color: var(--label-2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cell-value {
    font-size: 17px;
    color: var(--label-2);
    flex: none;
    font-variant-numeric: tabular-nums;
  }
  .cell-value.accent { color: var(--orange); font-weight: 600; }

  .cell-badge {
    font-size: 13px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    flex: none;
    color: var(--label-2);
    background: var(--fill-4);
  }
  .cell-badge.done { color: var(--green); background: color-mix(in srgb, var(--green) 15%, transparent); }

  .chev { color: var(--gray-3); flex: none; }

  /* ---------- 3칸 통계 ---------- */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    position: relative;
  }
  .stat {
    padding: 14px 6px 13px;
    text-align: center;
    position: relative;
  }
  .stat + .stat::before {
    content: "";
    position: absolute;
    left: 0; top: 12px; bottom: 12px;
    width: .5px;
    background: var(--separator);

<script>
  (function () {
    'use strict';

    /* iOS Large Title: 큰 제목이 네비바 아래로 지나가면 컴팩트 제목으로 전환 */
    var navbar = document.getElementById('navbar');
    var largeHead = document.getElementById('largeHead');
    var scroller = document.querySelector('.scroll');

    function sync() {
      var passed = largeHead.getBoundingClientRect().bottom
                 <= navbar.getBoundingClientRect().bottom;
      navbar.classList.toggle('is-stuck', passed);
    }
    scroller.addEventListener('scroll', sync, { passive: true });
    window.addEventListener('resize', sync);
    sync();

    /* 오늘 날짜 — 년 / 월일 / 요일 */
    var todayLine = document.getElementById('todayLine');
    if (todayLine) {
      var DAYS = ['일', '월', '화', '수', '목', '금', '토'];
      var d = new Date();
      todayLine.textContent =
        d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' +
        d.getDate() + '일 ' + DAYS[d.getDay()] + '요일';
    }

    /* 탭 선택 */
    var tabs = document.querySelectorAll('.tab');
    tabs.forEach(function (tab) {
      tab.addEventListener('click', function () {
        tabs.forEach(function (t) { t.removeAttribute('aria-current'); });
        tab.setAttribute('aria-current', 'page');
      });
    });

    /* ==========================================================
       키 현황 연산
       남자 200개(001–200), 여자 207개(001–207).
       기본값은 전부 '정상'이고 상태가 바뀐 키만 예외로 저장한다.
       정상 개수 = 전체 − 예외 개수 → 합이 항상 맞는다.
       ========================================================== */
    var TOTAL  = { m: 200, f: 207 };
    var GENDER = { m: '남자', f: '여자' };
    var STATUS = { ok: '정상', lost: '분실', broken: '고장', etc: '기타' };
    var STORE  = 'baikal.keys.v1';

    var data = { m: {}, f: {}, log: [] };

    try {
      var saved = localStorage.getItem(STORE);
      if (saved) {
        var p = JSON.parse(saved);
        data.m = p.m || {};
        data.f = p.f || {};
        data.log = p.log || [];
      }
    } catch (e) { /* 저장소를 못 쓰면 이번 세션에서만 동작 */ }

    /* 메모가 생기기 전에는 상태를 문자열로 저장했다 — 객체 형태로 맞춰준다 */
    ['m', 'f'].forEach(function (g) {
      Object.keys(data[g]).forEach(function (no) {
        if (typeof data[g][no] === 'string') data[g][no] = { s: data[g][no], memo: '' };
      });
    });

    function persist() {
      try { localStorage.setItem(STORE, JSON.stringify(data)); } catch (e) {}
    }

    function countOf(g) {
      var c = { ok: 0, lost: 0, broken: 0, etc: 0 };
      var ex = data[g], n = 0;
      for (var no in ex) {
        if (Object.prototype.hasOwnProperty.call(ex, no)) { c[ex[no].s]++; n++; }
      }
      c.ok = TOTAL[g] - n;
      return c;
    }

    /* 메모는 사용자가 직접 쓰는 값이라 화면에 넣기 전에 반드시 처리한다 */
    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
      });
    }

    function put(id, v) {
      var el = document.getElementById(id);
      if (el) el.textContent = v;
    }
    function pad3(n) { return ('00' + n).slice(-3); }

    function ago(iso) {
      var s = Math.floor((new Date() - new Date(iso)) / 1000);
      if (s < 60) return '방금';
      if (s < 3600) return Math.floor(s / 60) + '분 전';
      if (s < 86400) return Math.floor(s / 3600) + '시간 전';
      return Math.floor(s / 86400) + '일 전';
    }

    var logGroup = document.getElementById('logGroup');

    function renderLog() {
      if (!logGroup) return;
      if (!data.log.length) {
        logGroup.innerHTML =
          '<p class="empty">아직 등록된 변경이 없습니다<br>모든 키가 정상 상태입니다</p>';
        return;
      }
      logGroup.innerHTML = data.log.slice(0, 6).map(function (e) {
        var sub = e.memo ? esc(e.memo) + ' · ' + ago(e.at) : ago(e.at);
        return '<div class="cell has-icon">' +
                 '<span class="cell-ico"><span class="log-dot" style="background:var(--st-' + e.s + ')"></span></span>' +
                 '<span class="cell-body">' +
                   '<span class="cell-title">' + GENDER[e.g] + ' ' + pad3(e.no) + '번 · ' + STATUS[e.s] + '</span>' +
                   '<span class="cell-sub">' + sub + '</span>' +
                 '</span>' +
               '</div>';
      }).join('');
    }

    function render() {
      var m = countOf('m'), f = countOf('f');
      put('mOk', m.ok); put('mLost', m.lost); put('mBroken', m.broken); put('mEtc', m.etc);
      put('fOk', f.ok); put('fLost', f.lost); put('fBroken', f.broken); put('fEtc', f.etc);
      put('tAll', TOTAL.m + TOTAL.f);
      put('tOk',     m.ok     + f.ok);
      put('tLost',   m.lost   + f.lost);
      put('tBroken', m.broken + f.broken);
      put('tEtc',    m.etc    + f.etc);
      renderLog();
    }

    /* ---------- 등록 모달 ---------- */
    var sheet     = document.getElementById('sheet');
    var scrim     = document.getElementById('scrim');
    var openBtn   = document.getElementById('openSheet');
    var closeBtn  = document.getElementById('closeSheet');
    var submitBtn = document.getElementById('submitBtn');
    var noInput   = document.getElementById('noInput');
    var noError   = document.getElementById('noError');
    var rangeHint = document.getElementById('rangeHint');
    var seg       = document.getElementById('genderSeg');
    var pick      = document.getElementById('statusPick');
    var memoInput = document.getElementById('memoInput');
    var memoCount = document.getElementById('memoCount');
    var toastEl   = document.getElementById('toast');

    var draft = { g: 'm', no: null, s: null };
    var toastTimer;

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('is-on');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.classList.remove('is-on'); }, 2400);
    }

    function syncGender() {
      seg.querySelectorAll('button').forEach(function (b) {
        b.setAttribute('aria-pressed', String(b.dataset.g === draft.g));
      });
      rangeHint.textContent = '1 – ' + TOTAL[draft.g];
    }

    function syncStatus() {
      pick.querySelectorAll('button').forEach(function (b) {
        b.setAttribute('aria-pressed', String(b.dataset.s === draft.s));
      });
    }

    function validate() {
      var max = TOTAL[draft.g];
      var raw = noInput.value;
      var n = parseInt(raw, 10);
      var valid = raw !== '' && !isNaN(n) && n >= 1 && n <= max;

      draft.no = valid ? n : null;

      if (raw !== '' && !valid) {
        noError.textContent = GENDER[draft.g] + ' 키는 1번부터 ' + max + '번까지 있습니다';
        noError.classList.add('is-on');
      } else {
        noError.classList.remove('is-on');
      }
      submitBtn.disabled = !(valid && draft.s);
    }

    function openSheet() {
      draft = { g: 'm', no: null, s: null };
      noInput.value = '';
      memoInput.value = '';
      memoCount.textContent = '0';
      noError.classList.remove('is-on');
      syncGender(); syncStatus(); validate();
      scrim.classList.add('is-open');
      sheet.classList.add('is-open');
    }

    function closeSheet() {
      scrim.classList.remove('is-open');
      sheet.classList.remove('is-open');
      noInput.blur();
    }

    openBtn.addEventListener('click', openSheet);
    closeBtn.addEventListener('click', closeSheet);
    scrim.addEventListener('click', closeSheet);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeSheet();
    });

    /* 숫자만 남긴다 — 키패드 외 입력이 들어와도 안전하게 */
    noInput.addEventListener('input', function () {
      var only = noInput.value.replace(/[^0-9]/g, '').slice(0, 3);
      if (only !== noInput.value) noInput.value = only;
      validate();
    });

    /* 메모는 선택 입력이라 등록 버튼 활성화 조건에는 넣지 않는다 */
    memoInput.addEventListener('input', function () {
      memoCount.textContent = memoInput.value.length;
    });

    seg.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-g]');
      if (!b) return;
      draft.g = b.dataset.g;
      syncGender();
      validate();
    });

    pick.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-s]');
      if (!b) return;
      draft.s = b.dataset.s;
      syncStatus();
      validate();
    });

    submitBtn.addEventListener('click', function () {
      if (submitBtn.disabled) return;
      var g = draft.g, no = draft.no, s = draft.s;
      var memo = memoInput.value.trim();

      /* 정상으로 되돌리면 예외에서 지운다 */
      if (s === 'ok') delete data[g][no];
      else data[g][no] = { s: s, memo: memo };

      data.log.unshift({ g: g, no: no, s: s, memo: memo, at: new Date().toISOString() });
      data.log = data.log.slice(0, 30);

      persist();
      render();
      closeSheet();
      toast(GENDER[g] + ' ' + pad3(no) + '번 · ' + STATUS[s] + ' 등록됨');
    });

    render();
  })();
</script>

</body>
</html>
