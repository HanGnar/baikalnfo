<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- TDS 핸드오프 번들은 light 모드 카노니컬 값만 제공한다 (Known Gaps: 다크 alias 미공개) -->
<meta name="color-scheme" content="light">

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="바이칼 서현점">

<title>바이칼 휘트니스 서현점 — 근무 관리</title>

<style>
  /* TPS(Toss Product Sans)는 외부 재배포 불가 — TDS가 명시한 대체 서체 Pretendard */
  @import url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css");

  /* ============================================================
     TOSS DESIGN SYSTEM — base palette
     ============================================================ */
  :root {
    --blue-500: oklch(0.624 0.176 254);   /* 카노니컬 Toss Blue */
    --blue-600: oklch(0.522 0.176 257);
    --blue-700: oklch(0.476 0.174 259);
    --blue-50:  oklch(0.965 0.020 250);

    --grey-900: oklch(0.234 0.030 254);   /* primary text — 순수 검정이 아닌 cool navy */
    --grey-800: oklch(0.342 0.030 253);
    --grey-700: oklch(0.452 0.028 253);   /* secondary text */
    --grey-600: oklch(0.555 0.022 253);
    --grey-500: oklch(0.652 0.020 252);
    --grey-400: oklch(0.752 0.016 251);
    --grey-300: oklch(0.840 0.012 248);
    --grey-200: oklch(0.913 0.008 247);   /* default divider */
    --grey-100: oklch(0.957 0.005 247);   /* secondary surface */
    --grey-50:  oklch(0.978 0.003 247);
    --white:    oklch(1.000 0.000 0);

    --red-500:    oklch(0.628 0.218 22);
    --green-500:  oklch(0.493 0.143 154);
    --orange-500: oklch(0.748 0.183 56);
    --navy-900:   oklch(0.155 0.060 261); /* shadow / alpha 베이스 */

    /* ---- semantic: foreground ---- */
    --tds-fg-primary:    var(--grey-900);
    --tds-fg-secondary:  var(--grey-700);
    --tds-fg-tertiary:   oklch(0.155 0.060 261 / 0.58);
    --tds-fg-quaternary: oklch(0.155 0.060 261 / 0.28);
    --tds-fg-disabled:   var(--grey-400);
    --tds-fg-inverse:    var(--white);
    --tds-fg-brand:      var(--blue-500);
    --tds-fg-danger:     var(--red-500);
    --tds-fg-success:    var(--green-500);

    /* ---- semantic: background ---- */
    --tds-bg-primary:     var(--white);
    --tds-bg-secondary:   var(--grey-100);
    --tds-bg-tertiary:    var(--grey-200);
    --tds-bg-elevated:    var(--white);
    --tds-bg-overlay:     oklch(0 0 0 / 0.56);
    --tds-bg-brand:       var(--blue-500);
    --tds-bg-brand-weak:  var(--blue-50);
    --tds-bg-danger:      var(--red-500);

    /* ---- semantic: line ---- */
    --tds-line-default: var(--grey-200);
    --tds-line-subtle:  oklch(0 0 0 / 0.08);
    --tds-line-strong:  var(--grey-400);

    /* ---- state ---- */
    --tds-press-overlay:    oklch(0 0 0 / 0.26);
    --tds-disabled-opacity: 0.30;

    /* ---- 키 상태 (semantic 데이터 색) ---- */
    --st-ok:     var(--green-500);
    --st-lost:   var(--red-500);
    --st-broken: var(--orange-500);
    --st-etc:    var(--blue-500);

    /* ---- type ---- */
    --sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
            "SF Pro Text", "SF Pro", "Apple SD Gothic Neo", "Noto Sans KR",
            Roboto, "Helvetica Neue", Arial, sans-serif;

    /* ---- spacing (4px base) ---- */
    --space-1: 4px;   --space-2: 8px;   --space-3: 12px;  --space-4: 16px;
    --space-5: 20px;  --space-6: 24px;  --space-8: 32px;  --space-10: 40px;

    /* ---- rounded ---- */
    --radius-xs: 4px;   --radius-s: 8px;    --radius-m: 12px;
    --radius-l: 14px;   --radius-xl: 16px;  --radius-2xl: 20px;
    --radius-3xl: 24px; --radius-4xl: 32px; --radius-full: 999px;

    /* ---- elevation (navy-900 낮은 알파) ---- */
    --shadow-1: 0 1px 2px oklch(0.155 0.060 261 / 0.04),
                0 1px 1px oklch(0.155 0.060 261 / 0.04);
    --shadow-2: 0 4px 12px oklch(0.155 0.060 261 / 0.06),
                0 1px 2px oklch(0.155 0.060 261 / 0.04);
    --shadow-3: 0 12px 32px oklch(0.155 0.060 261 / 0.10),
                0 2px 6px oklch(0.155 0.060 261 / 0.06);
    --shadow-toast: 0 8px 24px oklch(0.155 0.060 261 / 0.16);
    --shadow-sheet: 0 -2px 12px oklch(0.155 0.060 261 / 0.06);

    /* ---- motion ---- */
    --ease:     cubic-bezier(0.22, 0.61, 0.36, 1);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --dur-fast: 120ms;
    --dur-base: 200ms;
    --dur-slow: 320ms;
  }

  /* OKLCH 미지원 브라우저용 hex 폴백 */
  @supports not (color: oklch(0 0 0)) {
    :root {
      --blue-500: #3182F6; --blue-600: #1B64DA; --blue-700: #1957C2; --blue-50: #EBF2FE;
      --grey-900: #191F28; --grey-800: #333D4B; --grey-700: #4E5968; --grey-600: #6B7684;
      --grey-500: #8B95A1; --grey-400: #B0B8C1; --grey-300: #D1D6DB; --grey-200: #E5E8EB;
      --grey-100: #F2F4F6; --grey-50: #F9FAFB; --white: #FFFFFF;
      --red-500: #F04452; --green-500: #04835B; --orange-500: #FF8A00; --navy-900: #0D1526;
      --tds-fg-tertiary: rgba(13, 21, 38, .58);
      --tds-fg-quaternary: rgba(13, 21, 38, .28);
      --tds-bg-overlay: rgba(0, 0, 0, .56);
      --tds-line-subtle: rgba(0, 0, 0, .08);
      --tds-press-overlay: rgba(0, 0, 0, .26);
    }
  }

  /* ============================================================
     BASE — body-2 (15 / 1.5 / -0.005em / 400)
     ============================================================ */
  * { box-sizing: border-box; }

  body {
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--tds-bg-primary);
    color: var(--tds-fg-primary);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    letter-spacing: -0.005em;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }

  button {
    font: inherit;
    letter-spacing: inherit;
    color: inherit;
    border: 0;
    background: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  h1, h2, h3, p, ul { margin: 0; }
  ul { list-style: none; padding: 0; }

  :focus-visible {
    outline: 2px solid var(--tds-fg-brand);
    outline-offset: 2px;
    border-radius: var(--radius-xs);
  }

  .tnum { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

  /* ---- type ramp ---- */
  .t-h1     { font-size: 28px; line-height: 1.30; letter-spacing: -0.020em; font-weight: 700; }
  .t-h3     { font-size: 22px; line-height: 1.30; letter-spacing: -0.015em; font-weight: 700; }
  .t-h4     { font-size: 20px; line-height: 1.35; letter-spacing: -0.015em; font-weight: 700; }
  .t-title1 { font-size: 18px; line-height: 1.45; letter-spacing: -0.010em; font-weight: 600; }
  .t-title2 { font-size: 17px; line-height: 1.45; letter-spacing: -0.010em; font-weight: 600; }
  .t-body1  { font-size: 17px; line-height: 1.50; letter-spacing: -0.005em; font-weight: 400; }
  .t-body2  { font-size: 15px; line-height: 1.50; letter-spacing: -0.005em; font-weight: 400; }
  .t-body3  { font-size: 13px; line-height: 1.50; letter-spacing: 0;        font-weight: 400; }
  .t-label-l{ font-size: 17px; line-height: 1.25; letter-spacing: -0.005em; font-weight: 700; }
  .t-label-m{ font-size: 15px; line-height: 1.25; letter-spacing: -0.005em; font-weight: 600; }
  .t-label-s{ font-size: 13px; line-height: 1.25; letter-spacing: 0;        font-weight: 600; }
  .t-caption{ font-size: 12px; line-height: 1.40; letter-spacing: 0;        font-weight: 500; }

  /* pressed = 검정 26% 오버레이 (그림자 아님) */
  .pressable { position: relative; overflow: hidden; }
  .pressable::after {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--tds-press-overlay);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur-fast) var(--ease);
  }
  .pressable:active::after { opacity: 1; }
  .pressable:disabled { opacity: var(--tds-disabled-opacity); }
  .pressable:disabled::after { opacity: 0; }

  /* ============================================================
     APP SHELL
     ============================================================ */
  .app {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: var(--tds-bg-primary);
    padding-top: env(safe-area-inset-top);
  }
  @media (min-width: 600px) {
    .app { max-width: 430px; margin: 0 auto; border-inline: 1px solid var(--tds-line-default); }
  }

  /* ---------- top-app-bar (56pt · 좌측 정렬 타이틀) ---------- */
  .topbar {
    flex: none;
    height: 56px;
    display: flex;
    align-items: center;
    gap: var(--space-2);
    padding: 0 var(--space-4) 0 var(--space-5);
    background: var(--tds-bg-primary);
    border-bottom: 1px solid transparent;
    transition: border-color var(--dur-base) var(--ease);
  }
  .topbar.is-stuck { border-bottom-color: var(--tds-line-default); }

  .brand-mark { width: 26px; height: 30px; display: block; flex: none; }

  .nav-title {
    flex: 1;
    min-width: 0;
    font-size: 18px;
    line-height: 1.45;
    letter-spacing: -0.010em;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0;
    transform: translateY(2px);
    transition: opacity var(--dur-base) var(--ease),
                transform var(--dur-base) var(--ease);
  }
  .topbar.is-stuck .nav-title { opacity: 1; transform: none; }

  .icon-btn {
    width: 40px; height: 40px;
    display: grid;
    place-items: center;
    border-radius: var(--radius-m);
    color: var(--tds-fg-primary);
    flex: none;
    margin-left: auto;
  }

  /* ---------- scroll ---------- */
  .scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 0 var(--space-6) var(--space-8);
    display: flex;
    flex-direction: column;
    gap: var(--space-10);
  }

  /* 홈 스크롤만 — 떠 있는 탭바 높이(64) + 아래 여백 + 숨 쉴 공간 */
  .app > .scroll {
    padding-bottom: calc(64px + var(--space-3) + var(--space-6) + env(safe-area-inset-bottom));
  }

  .hero { padding: var(--space-2) 0 0; }
  .hero-title {
    display: flex;
    align-items: center;
    gap: var(--space-1);
    padding: 0;
    text-align: left;
    max-width: 100%;
  }
  .hero-title span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hero-title svg { color: var(--grey-400); flex: none; }
  .hero-sub { margin-top: var(--space-1); color: var(--tds-fg-tertiary); }

  /* ---------- list-header ---------- */
  .list-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--space-3);
    margin-bottom: var(--space-4);
  }
  .text-btn {
    padding: 0;
    display: flex;
    align-items: center;
    gap: 1px;
    color: var(--tds-fg-brand);
    font-size: 15px;
    line-height: 1.25;
    letter-spacing: -0.005em;
    font-weight: 600;
    flex: none;
  }
  .text-btn:active { opacity: .55; }

  /* ============================================================
     카드 — 흰 표면 + 1px 헤어라인, 평면
     ============================================================ */
  .card {
    background: var(--tds-bg-primary);
    border: 1px solid var(--tds-line-default);
    border-radius: var(--radius-2xl);
    overflow: hidden;
  }

  .total-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    padding: var(--space-4) var(--space-5);
  }
  .total-row .value { font-variant-numeric: tabular-nums; }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-top: 1px solid var(--tds-line-default);
  }
  .stat {
    position: relative;
    padding: var(--space-3) var(--space-1) var(--space-4);
    text-align: center;
  }
  .stat + .stat::before {
    content: "";
    position: absolute;
    left: 0; top: 14px; bottom: 14px;
    width: 1px;
    background: var(--tds-line-default);
  }
  .stat-num {
    font-size: 20px;
    line-height: 1.35;
    letter-spacing: -0.015em;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--c, var(--tds-fg-primary));
  }
  .stat-label { margin-top: 2px; color: var(--tds-fg-tertiary); }

  /* ---------- 남자/여자 카드 ---------- */
  .key-cards {
    margin-top: var(--space-3);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-3);
  }
  .key-card {
    background: var(--tds-bg-primary);
    border: 1px solid var(--tds-line-default);
    border-radius: var(--radius-2xl);
    padding: var(--space-4) var(--space-4) var(--space-3);
    text-align: left;
  }
  .key-card .who {
    display: flex;
    align-items: center;
    gap: 1px;
  }
  .key-card .who svg { color: var(--grey-400); flex: none; }
  .key-card .range {
    margin-top: 1px;
    color: var(--tds-fg-tertiary);
    font-variant-numeric: tabular-nums;
  }
  .key-card .amount {
    margin-top: var(--space-2);
    display: flex;
    align-items: baseline;
    gap: 2px;
  }
  .key-card .amount b {
    font-size: 24px;
    line-height: 1.30;
    letter-spacing: -0.020em;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .key-card .amount span { color: var(--tds-fg-tertiary); }

  .breakdown {
    margin-top: var(--space-3);
    padding-top: var(--space-3);
    border-top: 1px solid var(--tds-line-default);
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
  }
  .breakdown li {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    line-height: 1.25;
  }
  .breakdown i {
    width: 7px; height: 7px;
    border-radius: var(--radius-full);
    background: var(--d);
    flex: none;
  }
  .breakdown .l { flex: 1; color: var(--tds-fg-tertiary); font-size: 13px; }
  .breakdown .v { font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 600; }

  .card-more {
    margin-top: var(--space-3);
    padding-top: var(--space-2);
    border-top: 1px solid var(--tds-line-default);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1px;
    color: var(--tds-fg-tertiary);
  }

  /* ============================================================
     button — XL 56 / radius 16 / label-l
     ============================================================ */
  .btn-xl {
    margin-top: var(--space-4);
    width: 100%;
    height: 56px;
    border-radius: var(--radius-xl);
    background: var(--tds-bg-brand);
    color: var(--tds-fg-inverse);
    font-size: 17px;
    line-height: 1.25;
    letter-spacing: -0.005em;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ============================================================
     list-row
     ============================================================ */
  .rows { display: flex; flex-direction: column; }
  .row {
    position: relative;
    display: flex;
    align-items: center;
    gap: var(--space-4);
    width: 100%;
    min-height: 44px;
    padding: var(--space-4) 0;
    text-align: left;
  }
  .row + .row::before {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 1px;
    background: var(--tds-line-default);
  }
  .row-body { flex: 1; min-width: 0; }
  .row-title {
    font-size: 15px;
    line-height: 1.45;
    letter-spacing: -0.010em;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row-sub {
    margin-top: 2px;
    color: var(--tds-fg-tertiary);
    font-size: 13px;
    line-height: 1.5;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row-sub.wrap {
    margin-top: var(--space-1);
    white-space: normal;
    overflow: visible;
    text-overflow: clip;
    word-break: break-word;
  }
  .row-value { flex: none; font-variant-numeric: tabular-nums; }
  .chev { color: var(--grey-400); flex: none; }

  .badge-mark {
    width: 44px; height: 44px;
    border-radius: var(--radius-l);
    display: grid;
    place-items: center;
    background: var(--bg, var(--grey-100));
    color: var(--c, var(--tds-fg-secondary));
    flex: none;
  }

  .empty {
    padding: var(--space-6) var(--space-4);
    text-align: center;
    color: var(--tds-fg-tertiary);
  }

  /* ============================================================
     tab-bar — floating 변형 (radius 24 · 1px 보더)
     ============================================================ */
  /* 콘텐츠 위에 떠 있다 — 스크롤한 내용이 알약 밑으로 흘러 들어가 가려진다 */
  .tabbar {
    position: absolute;
    left: var(--space-4);
    right: var(--space-4);
    bottom: calc(var(--space-3) + env(safe-area-inset-bottom));
    z-index: 40;
    height: 64px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    background: var(--tds-bg-elevated);
    border: 1px solid var(--tds-line-default);
    border-radius: var(--radius-3xl);
    box-shadow: var(--shadow-1);
    overflow: hidden;
  }
  .tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--space-1);
    color: var(--tds-fg-tertiary);
    font-size: 11px;
    line-height: 1.4;
    letter-spacing: 0;
    font-weight: 500;
    transition: color var(--dur-base) var(--ease);
  }
  /* active = filled 아이콘 + fg-primary (브랜드 블루가 아니다) */
  .tab[aria-current="page"] { color: var(--tds-fg-primary); font-weight: 600; }
  .tab .fill { display: none; }
  .tab .line { display: block; }
  .tab[aria-current="page"] .fill { display: block; }
  .tab[aria-current="page"] .line { display: none; }

  /* ============================================================
     상세 화면
     ============================================================ */
  .detail {
    position: absolute;
    inset: 0;
    z-index: 55;
    display: flex;
    flex-direction: column;
    background: var(--tds-bg-primary);
    padding-top: env(safe-area-inset-top);
    transform: translateX(100%);
    transition: transform var(--dur-slow) var(--ease-out);
  }
  .detail.is-open { transform: none; }

  .detail-bar {
    flex: none;
    height: 56px;
    display: flex;
    align-items: center;
    padding: 0 var(--space-4);
  }
  .back {
    width: 40px; height: 40px;
    display: grid;
    place-items: center;
    border-radius: var(--radius-m);
    color: var(--tds-fg-primary);
    padding: 0;
    margin-left: -8px;
  }

  .table { display: flex; flex-direction: column; }
  .table-row {
    position: relative;
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-4) var(--space-5);
  }
  .table-row + .table-row::before {
    content: "";
    position: absolute;
    left: var(--space-5); right: var(--space-5); top: 0;
    height: 1px;
    background: var(--tds-line-default);
  }
  .table-row .dot {
    width: 8px; height: 8px;
    border-radius: var(--radius-full);
    background: var(--c);
    flex: none;
  }
  .table-row .label { flex: 1; }
  .table-row .num { font-variant-numeric: tabular-nums; font-weight: 600; }
  .table-row.is-total { background: var(--grey-50); }
  .table-row.is-total .label,
  .table-row.is-total .num { font-weight: 700; }

  .group-title {
    display: flex;
    align-items: center;
    gap: var(--space-2);
  }
  .group-title .dot {
    width: 8px; height: 8px;
    border-radius: var(--radius-full);
    background: var(--c);
    flex: none;
  }
  .group-count { color: var(--tds-fg-tertiary); font-variant-numeric: tabular-nums; }

  .card .row { padding-left: var(--space-5); padding-right: var(--space-5); }
  .card .row + .row::before { left: var(--space-5); right: var(--space-5); }

  /* 정상 키 번호 — full pill chip */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
    padding: var(--space-4) var(--space-5) var(--space-5);
    border-top: 1px solid var(--tds-line-default);
  }
  .chips[hidden] { display: none; }
  .chips span {
    height: 30px;
    padding: 0 var(--space-3);
    display: inline-flex;
    align-items: center;
    border-radius: var(--radius-full);
    border: 1px solid var(--tds-line-default);
    color: var(--tds-fg-secondary);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }

  /* ============================================================
     bottom-sheet
     ============================================================ */
  .scrim {
    position: absolute;
    inset: 0;
    background: var(--tds-bg-overlay);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur-slow) var(--ease);
    z-index: 70;
  }
  .scrim.is-open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    max-height: 92%;
    z-index: 80;
    display: flex;
    flex-direction: column;
    background: var(--tds-bg-elevated);
    border-radius: var(--radius-3xl) var(--radius-3xl) 0 0;
    box-shadow: var(--shadow-sheet);
    transform: translateY(101%);
    transition: transform var(--dur-slow) var(--ease-out);
  }
  .sheet.is-open { transform: none; }

  .sheet-bar {
    flex: none;
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-5) var(--space-5) var(--space-3);
  }
  .sheet-bar .title { flex: 1; }
  .sheet-close {
    width: 32px; height: 32px;
    border-radius: var(--radius-full);
    display: grid;
    place-items: center;
    background: var(--grey-100);
    color: var(--tds-fg-secondary);
    padding: 0;
    flex: none;
  }

  .sheet-body {
    overflow-y: auto;
    padding: var(--space-2) var(--space-5) var(--space-5);
    display: flex;
    flex-direction: column;
    gap: var(--space-6);
  }

  .field-label {
    margin-bottom: var(--space-2);
    color: var(--tds-fg-secondary);
    font-size: 13px;
    line-height: 1.25;
    font-weight: 600;
  }
  .field-label .optional {
    margin-left: var(--space-1);
    padding: 1px var(--space-2);
    border-radius: var(--radius-full);
    background: var(--grey-100);
    color: var(--tds-fg-tertiary);
    font-size: 11px;
    font-weight: 500;
  }

  /* segmented-control — grey-100 트랙, 선택 분절은 흰 배경 + shadow-1 */
  .segmented {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-1);
    padding: var(--space-1);
    border-radius: var(--radius-l);
    background: var(--tds-bg-secondary);
  }
  .segmented button {
    height: 40px;
    border-radius: var(--radius-m);
    color: var(--tds-fg-secondary);
    font-size: 15px;
    line-height: 1.25;
    letter-spacing: -0.005em;
    font-weight: 600;
    transition: background-color var(--dur-base) var(--ease),
                color var(--dur-base) var(--ease);
  }
  .segmented button[aria-pressed="true"] {
    background: var(--tds-bg-primary);
    color: var(--tds-fg-primary);
    box-shadow: var(--shadow-1);
  }

  /* text-field — 48px · radius 12 · grey-100 → focus 흰 배경 + 1.5px blue */
  .text-field {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    min-height: 48px;
    padding: 0 var(--space-4);
    border-radius: var(--radius-m);
    background: var(--tds-bg-secondary);
    border: 1px solid var(--tds-line-default);
    transition: background-color var(--dur-base) var(--ease),
                border-color var(--dur-base) var(--ease),
                box-shadow var(--dur-base) var(--ease);
  }
  .text-field:focus-within {
    background: var(--tds-bg-primary);
    border-color: var(--tds-fg-brand);
    box-shadow: inset 0 0 0 0.5px var(--tds-fg-brand);
  }
  .text-field input {
    flex: 1;
    min-width: 0;
    border: 0;
    padding: var(--space-3) 0;
    background: none;
    font: inherit;
    letter-spacing: inherit;
    font-size: 17px;
    font-variant-numeric: tabular-nums;
    color: var(--tds-fg-primary);
    outline: none;
  }
  .text-field input::placeholder { color: var(--tds-fg-quaternary); }
  .text-field .suffix { flex: none; color: var(--tds-fg-tertiary); font-variant-numeric: tabular-nums; }

  .field-error {
    display: none;
    margin-top: var(--space-2);
    padding-left: var(--space-1);
    color: var(--tds-fg-danger);
    font-size: 13px;
    line-height: 1.5;
  }
  .field-error.is-on { display: block; }

  /* 상태 선택 */
  .pick {
    border: 1px solid var(--tds-line-default);
    border-radius: var(--radius-xl);
    overflow: hidden;
  }
  .pick button {
    position: relative;
    display: flex;
    align-items: center;
    gap: var(--space-3);
    width: 100%;
    min-height: 52px;
    padding: 0 var(--space-4);
    text-align: left;
  }
  .pick button + button::before {
    content: "";
    position: absolute;
    left: var(--space-4); right: 0; top: 0;
    height: 1px;
    background: var(--tds-line-default);
  }
  .pick .dot {
    width: 10px; height: 10px;
    border-radius: var(--radius-full);
    background: var(--c);
    flex: none;
  }
  .pick .name { flex: 1; }
  .pick .check { color: var(--tds-fg-brand); flex: none; opacity: 0; transition: opacity var(--dur-fast) var(--ease); }
  .pick button[aria-pressed="true"] .check { opacity: 1; }
  .pick button[aria-pressed="true"] .name { font-weight: 600; }

  /* 사진 */
  .photos {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
  }
  .photo-add {
    width: 76px; height: 76px;
    border-radius: var(--radius-m);
    background: var(--tds-bg-secondary);
    border: 1px solid var(--tds-line-default);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    color: var(--tds-fg-tertiary);
    font-size: 11px;
    line-height: 1.4;
    font-weight: 500;
  }
  .photo-thumb {
    position: relative;
    width: 76px; height: 76px;
    padding: 0;
    border-radius: var(--radius-m);
    border: 1px solid var(--tds-line-default);
    overflow: hidden;
  }
  .photo-thumb img {
    display: block;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .photo-thumb .x {
    position: absolute;
    top: 4px; right: 4px;
    width: 20px; height: 20px;
    border-radius: var(--radius-full);
    background: oklch(0 0 0 / 0.55);
    color: #fff;
    display: grid;
    place-items: center;
  }

  /* dialog — 흰 표면 · radius 20 · 24px padding · shadow-3 */
  .dialog-scrim {
    position: absolute;
    inset: 0;
    z-index: 100;
    background: var(--tds-bg-overlay);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur-base) var(--ease);
  }
  .dialog-scrim.is-open { opacity: 1; pointer-events: auto; }

  .dialog {
    position: absolute;
    left: var(--space-6); right: var(--space-6);
    top: 50%;
    z-index: 105;
    padding: var(--space-6);
    border-radius: var(--radius-2xl);
    background: var(--tds-bg-elevated);
    box-shadow: var(--shadow-3);
    text-align: center;
    opacity: 0;
    transform: translateY(-50%) scale(0.96);
    pointer-events: none;
    transition: opacity var(--dur-base) var(--ease),
                transform var(--dur-base) var(--ease);
  }
  .dialog.is-open { opacity: 1; transform: translateY(-50%) scale(1); pointer-events: auto; }

  .dialog .body { margin-top: var(--space-2); color: var(--tds-fg-secondary); }
  .dialog-actions {
    margin-top: var(--space-6);
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
  }
  .dlg-btn {
    height: 48px;
    border-radius: var(--radius-l);
    font-size: 17px;
    line-height: 1.25;
    letter-spacing: -0.005em;
    font-weight: 700;
  }
  .dlg-btn.danger { background: var(--tds-bg-danger); color: var(--tds-fg-inverse); }
  .dlg-btn.secondary { background: var(--tds-bg-secondary); color: var(--tds-fg-primary); }

  /* 상세 목록의 사진 */
  .row-photos {
    display: flex;
    gap: var(--space-1);
    margin-top: var(--space-2);
  }
  .row-photos img {
    width: 44px; height: 44px;
    border-radius: var(--radius-s);
    border: 1px solid var(--tds-line-default);
    object-fit: cover;
    display: block;
  }

  /* ============================================================
     사진 크게 보기 — 사진이 주인공이라 어두운 바닥을 쓴다
     ============================================================ */
  .viewer {
    position: absolute;
    inset: 0;
    z-index: 90;              /* 상세(55) 위 · 다이얼로그(105) 아래 */
    display: flex;
    flex-direction: column;
    background: oklch(0.15 0 0 / 0.97);
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur-base) var(--ease);
  }
  .viewer.is-open { opacity: 1; pointer-events: auto; }

  .viewer-bar {
    flex: none;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 var(--space-4);
  }
  .viewer-bar .back { color: #FFFFFF; }
  .viewer-count {
    font-variant-numeric: tabular-nums;
    color: rgba(255, 255, 255, 0.72);
  }

  .viewer-stage {
    flex: 1;
    min-height: 0;
    display: grid;
    place-items: center;
    padding: 0 var(--space-4);
  }
  .viewer-stage img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: var(--radius-m);
    display: block;
  }

  .viewer-nav {
    flex: none;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: var(--space-4);
    padding: var(--space-6) 0;
  }
  .viewer-nav[hidden] { display: none; }   /* hidden 속성이 flex에 먹히도록 */
  .viewer-nav button {
    width: 48px; height: 48px;
    display: grid;
    place-items: center;
    padding: 0;
    border-radius: var(--radius-full);
    background: rgba(255, 255, 255, 0.14);
    color: #FFFFFF;
  }
  .viewer-nav button:disabled { opacity: var(--tds-disabled-opacity); }

  /* 메모 */
  .memo-field {
    padding: var(--space-3) var(--space-4);
    border-radius: var(--radius-m);
    background: var(--tds-bg-secondary);
    border: 1px solid var(--tds-line-default);
    transition: background-color var(--dur-base) var(--ease),
                border-color var(--dur-base) var(--ease);
  }
  .memo-field:focus-within {
    background: var(--tds-bg-primary);
    border-color: var(--tds-fg-brand);
    box-shadow: inset 0 0 0 0.5px var(--tds-fg-brand);
  }
  .memo-field textarea {
    display: block;
    width: 100%;
    height: 23px;
    max-height: 104px;
    border: 0;
    padding: 0;
    background: none;
    font: inherit;
    letter-spacing: inherit;
    font-size: 16px;
    line-height: 1.45;
    color: var(--tds-fg-primary);
    resize: none;
    outline: none;
    overflow-y: auto;
  }
  .memo-field textarea::placeholder { color: var(--tds-fg-quaternary); }
  .memo-count {
    margin-top: var(--space-2);
    padding-right: var(--space-1);
    text-align: right;
    color: var(--tds-fg-quaternary);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }

  /* bottom-cta — 위쪽 white → transparent 보호 그라디언트 */
  .sheet-cta {
    flex: none;
    position: relative;
    padding: var(--space-3) var(--space-5) calc(var(--space-5) + env(safe-area-inset-bottom));
    background: var(--tds-bg-elevated);
  }
  .sheet-cta::before {
    content: "";
    position: absolute;
    left: 0; right: 0; top: -28px;
    height: 28px;
    background: linear-gradient(to top, var(--tds-bg-elevated), transparent);
    pointer-events: none;
  }
  .btn-cta {
    width: 100%;
    height: 56px;
    border-radius: var(--radius-xl);
    background: var(--tds-bg-brand);
    color: var(--tds-fg-inverse);
    font-size: 17px;
    line-height: 1.25;
    letter-spacing: -0.005em;
    font-weight: 700;
  }

  /* toast — grey-900 표면 + 흰 라벨 */
  .toast {
    position: absolute;
    left: var(--space-4); right: var(--space-4);
    bottom: calc(88px + env(safe-area-inset-bottom));
    z-index: 120;   /* 다이얼로그(105)보다 위 — 닫히는 순간에도 가려지지 않게 */
    padding: var(--space-4);
    border-radius: var(--radius-l);
    background: var(--grey-900);
    color: var(--tds-fg-inverse);
    text-align: center;
    box-shadow: var(--shadow-toast);
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: opacity var(--dur-slow) var(--ease),
                transform var(--dur-slow) var(--ease);
  }
  .toast.is-on { opacity: 1; transform: none; }

  /* 등장 — 320ms 이내, 오버슈트 없음 */
  .rise { opacity: 0; transform: translateY(6px); animation: rise var(--dur-slow) var(--ease-out) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    .rise { opacity: 1; transform: none; }
  }
</style>
</head>

<body>

<div class="app">

  <!-- ============ top-app-bar ============ -->

      <path fill="url(#bk-face)" d="M8 5.5h24a2.5 2.5 0 0 1 2.5 2.5v16c0 7.7-6 12.9-14.5 17.2C11.5 36.9 5.5 31.7 5.5 24V8a2.5 2.5 0 0 1 2.5-2.5z"/>
      <text x="20" y="27" text-anchor="middle" fill="#fff"

    <span class="nav-title" id="navTitle">서현점</span>

    <button class="icon-btn pressable" type="button" aria-label="메뉴 열기">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>

  <main class="scroll">

    <!-- ============ hero ============ -->
    <div class="hero" id="largeHead">
      <button class="hero-title t-h1" type="button">
        <span>바이칼 휘트니스 서현점</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <p class="hero-sub t-body2" id="todayLine">2026년 8월 18일 화요일</p>
    </div>

    <!-- ============ 전체 키 현황 ============ -->
    <section class="rise" style="animation-delay:20ms" aria-labelledby="key-t">
      <div class="list-header">
        <h2 class="t-h4" id="key-t">전체 키 현황</h2>
      </div>

      <div class="card">

          <span class="value t-title2"><span id="tAll">407</span>개</span>

        <div class="stats">
          <div class="stat" style="--c:var(--st-ok)">
            <p class="stat-num" id="tOk">407</p>

          <div class="stat" style="--c:var(--st-broken)">

          <div class="stat" style="--c:var(--st-etc)">
            <p class="stat-num" id="tEtc">0</p>
            <p class="stat-label t-caption">기타</p>
          </div>
        </div>
      </div>

      <div class="key-cards">
        <button class="key-card pressable" type="button" data-detail="m">
          <span class="who t-title1">남자 키
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          </span>
          <p class="range t-body3">001 – 200</p>

          <ul class="breakdown">
            <li style="--d:var(--st-ok)"><i></i><span class="l">정상</span><span class="v tnum" id="mOk">200</span></li>
            <li style="--d:var(--st-lost)"><i></i><span class="l">분실</span><span class="v tnum" id="mLost">0</span></li>

          <span class="card-more t-caption">눌러서 상세 보기
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>

        </button>

        <button class="key-card pressable" type="button" data-detail="f">
          <span class="who t-title1">여자 키
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          </span>
          <p class="range t-body3">001 – 207</p>
          <p class="amount"><b>207</b><span class="t-body3">개</span></p>
          <ul class="breakdown">
            <li style="--d:var(--st-ok)"><i></i><span class="l">정상</span><span class="v tnum" id="fOk">207</span></li>
            <li style="--d:var(--st-lost)"><i></i><span class="l">분실</span><span class="v tnum" id="fLost">0</span></li>
            <li style="--d:var(--st-broken)"><i></i><span class="l">고장</span><span class="v tnum" id="fBroken">0</span></li>
            <li style="--d:var(--st-etc)"><i></i><span class="l">기타</span><span class="v tnum" id="fEtc">0</span></li>
          </ul>
          <span class="card-more t-caption">눌러서 상세 보기
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>

      <!-- 화면당 단 하나의 주요 액션 -->
      <button class="btn-xl pressable" type="button" id="openSheet">키 현황 등록</button>
    </section>

<script>
  (function () {
    'use strict';

    /* 상단바 구분선 */
    var navbar = document.getElementById('navbar');
    var largeHead = document.getElementById('largeHead');
    var scroller = document.querySelector('.app > .scroll');

    function sync() {
      var passed = largeHead.getBoundingClientRect().bottom
                 <= navbar.getBoundingClientRect().bottom;
      navbar.classList.toggle('is-stuck', passed);
    }
    scroller.addEventListener('scroll', sync, { passive: true });
    window.addEventListener('resize', sync);
    sync();

    /* 오늘 날짜 */
    var todayLine = document.getElementById('todayLine');
    if (todayLine) {
      var DAYS = ['일', '월', '화', '수', '목', '금', '토'];
      var d = new Date();
      todayLine.textContent =
        d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' +
        d.getDate() + '일 ' + DAYS[d.getDay()] + '요일';
    }

    /* 탭 선택 */
    var tabs = document.querySelectorAll('.tab');
    tabs.forEach(function (tab) {
      tab.addEventListener('click', function () {
        tabs.forEach(function (t) { t.removeAttribute('aria-current'); });
        tab.setAttribute('aria-current', 'page');
      });
    });

    /* ==========================================================
       키 현황 연산
       남자 200개(001–200), 여자 207개(001–207).
       기본값은 전부 '정상'이고 상태가 바뀐 키만 예외로 저장한다.
       정상 개수 = 전체 − 예외 개수 → 합이 항상 맞는다.
       ========================================================== */
    var TOTAL  = { m: 200, f: 207 };
    var GENDER = { m: '남자', f: '여자' };
    var STATUS = { ok: '정상', lost: '분실', broken: '고장', etc: '기타' };
    var STORE  = 'baikal.keys.v1';

    var data = { m: {}, f: {}, log: [] };

    try {
      var saved = localStorage.getItem(STORE);
      if (saved) {
        var p = JSON.parse(saved);
        data.m = p.m || {};
        data.f = p.f || {};
        data.log = p.log || [];
      }
    } catch (e) { /* 저장소를 못 쓰면 이번 세션에서만 동작 */ }

    /* 메모가 생기기 전에는 상태를 문자열로 저장했다 — 객체 형태로 맞춰준다 */
    ['m', 'f'].forEach(function (g) {
      Object.keys(data[g]).forEach(function (no) {
        if (typeof data[g][no] === 'string') data[g][no] = { s: data[g][no], memo: '' };
      });
    });

    /* 사진이 들어가면 용량이 커진다 — 저장 실패 여부를 돌려준다 */
    function persist() {
      try { localStorage.setItem(STORE, JSON.stringify(data)); return true; }
      catch (e) { return false; }
    }

    function countOf(g) {
      var c = { ok: 0, lost: 0, broken: 0, etc: 0 };
      var ex = data[g], n = 0;
      for (var no in ex) {
        if (Object.prototype.hasOwnProperty.call(ex, no)) { c[ex[no].s]++; n++; }
      }
      c.ok = TOTAL[g] - n;
      return c;
    }

    /* 메모는 사용자가 직접 쓰는 값이라 화면에 넣기 전에 반드시 처리한다 */
    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
      });
    }

    function put(id, v) {
      var el = document.getElementById(id);
      if (el) el.textContent = v;
    }
    function pad(n) { return ('00' + n).slice(-3); }

    function render() {
      var m = countOf('m'), f = countOf('f');
      put('mOk', m.ok); put('mLost', m.lost); put('mBroken', m.broken); put('mEtc', m.etc);
      put('fOk', f.ok); put('fLost', f.lost); put('fBroken', f.broken); put('fEtc', f.etc);
      put('tAll', TOTAL.m + TOTAL.f);
      put('tOk',     m.ok     + f.ok);
      put('tLost',   m.lost   + f.lost);
      put('tBroken', m.broken + f.broken);
      put('tEtc',    m.etc    + f.etc);
    }

    /* ==========================================================
       상세 화면
       ========================================================== */
    var detail      = document.getElementById('detail');
    var detailBody  = document.getElementById('detailBody');
    var detailBack  = document.getElementById('detailBack');
    var detailG     = null;

    var CHEV = '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" ' +
               'stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
               'stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>';

    function renderDetail(g) {
      var total = TOTAL[g];
      var c = countOf(g);
      var ex = data[g];

      var byStatus = { lost: [], broken: [], etc: [] };
      Object.keys(ex).forEach(function (no) {
        byStatus[ex[no].s].push({
          no: parseInt(no, 10),
          memo: ex[no].memo || '',
          photos: ex[no].photos || []
        });
      });
      Object.keys(byStatus).forEach(function (k) {
        byStatus[k].sort(function (a, b) { return a.no - b.no; });
      });

      var html = '<h1 class="t-h1" id="detailTitle">' + GENDER[g] + ' 키</h1>';

      /* 요약 표 */
      html += '<section><div class="list-header"><h2 class="t-h4">전체 요약</h2></div>' +
              '<div class="card"><div class="table">';
      ['ok', 'lost', 'broken', 'etc'].forEach(function (k) {
        html += '<div class="table-row" style="--c:var(--st-' + k + ')">' +
                  '<span class="dot"></span>' +
                  '<span class="label t-body1">' + STATUS[k] + '</span>' +
                  '<span class="num t-body1">' + c[k] + '</span>' +
                '</div>';
      });
      html += '<div class="table-row is-total">' +
                '<span class="label t-body1">합계</span>' +
                '<span class="num t-body1">' + total + '</span>' +
              '</div></div></div></section>';

      /* 분실 · 고장 · 기타 */
      ['lost', 'broken', 'etc'].forEach(function (k) {
        var list = byStatus[k];
        html += '<section><div class="list-header">' +
                  '<h2 class="group-title t-h4" style="--c:var(--st-' + k + ')">' +
                    '<span class="dot"></span>' + STATUS[k] +
                    '<span class="group-count t-body2">' + list.length + '</span>' +
                  '</h2></div><div class="card">';
        if (!list.length) {
          html += '<p class="empty t-body2">해당하는 키가 없어요</p>';
        } else {
          html += '<div class="rows">' + list.map(function (it) {
            return '<button class="row pressable" type="button" data-edit="' + g + ':' + it.no + '">' +
                     '<span class="row-body">' +
                       '<span class="row-title">' + pad(it.no) + '번</span>' +
                       (it.memo ? '<span class="row-sub wrap">' + esc(it.memo) + '</span>' : '') +
                       (it.photos.length
                         ? '<span class="row-photos">' + it.photos.map(function (src, i) {
                             return '<img src="' + src + '" alt="사진 ' + (i + 1) + '" ' +
                                    'data-view="' + g + ':' + it.no + ':' + i + '">';
                           }).join('') + '</span>'
                         : '') +
                     '</span>' + CHEV +
                   '</button>';
          }).join('') + '</div>';
        }
        html += '</div></section>';
      });

      /* 정상 — 번호가 많아 접어둔다 */
      html += '<section><div class="list-header">' +
                '<h2 class="group-title t-h4" style="--c:var(--st-ok)">' +
                  '<span class="dot"></span>정상' +
                  '<span class="group-count t-body2">' + c.ok + '</span>' +
                '</h2></div><div class="card">' +
                '<div class="rows"><button class="row pressable" type="button" id="okToggle">' +
                  '<span class="row-body"><span class="row-title">번호 전체 보기</span></span>' +
                  '<span class="row-value t-body2" style="color:var(--tds-fg-tertiary)">' + c.ok + '개</span>' +
                  CHEV +
                '</button></div>' +
                '<div class="chips" id="okChips" hidden></div>' +
              '</div></section>';

      detailBody.innerHTML = html;

      var toggle = document.getElementById('okToggle');
      var chips  = document.getElementById('okChips');
      toggle.addEventListener('click', function () {
        if (chips.hidden && !chips.innerHTML) {
          var out = [];
          for (var i = 1; i <= total; i++) {
            if (!ex[i]) out.push('<span>' + pad(i) + '</span>');
          }
          chips.innerHTML = out.join('');
        }
        chips.hidden = !chips.hidden;
        toggle.querySelector('.row-title').textContent =
          chips.hidden ? '번호 전체 보기' : '번호 접기';
      });

      detailBody.querySelectorAll('[data-edit]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var parts = btn.dataset.edit.split(':');
          openSheet(parts[0], parts[1]);
        });
      });

      /* 사진은 행 안에 있다 — 클릭이 행(수정 열기)까지 번지지 않게 막는다 */
      detailBody.querySelectorAll('[data-view]').forEach(function (img) {
        img.addEventListener('click', function (e) {
          e.stopPropagation();
          var parts = img.dataset.view.split(':');
          var rec = data[parts[0]][parts[1]];
          if (rec) openViewer(rec.photos || [], parseInt(parts[2], 10));
        });
      });
    }

    function openDetail(g) {
      detailG = g;
      renderDetail(g);
      detailBody.scrollTop = 0;
      detail.classList.add('is-open');
      detail.setAttribute('aria-hidden', 'false');
    }

    function closeDetail() {
      detail.classList.remove('is-open');
      detail.setAttribute('aria-hidden', 'true');
      detailG = null;
    }

    document.querySelectorAll('[data-detail]').forEach(function (card) {
      card.addEventListener('click', function () { openDetail(card.dataset.detail); });
    });
    detailBack.addEventListener('click', closeDetail);

    /* 아직 만들지 않은 화면 */
    document.querySelectorAll('.text-btn').forEach(function (link) {
      link.addEventListener('click', function () { toast('아직 만들고 있어요'); });
    });

    /* ==========================================================
       등록 시트
       ========================================================== */
    var sheet     = document.getElementById('sheet');
    var scrim     = document.getElementById('scrim');
    var openBtn   = document.getElementById('openSheet');
    var closeBtn  = document.getElementById('closeSheet');
    var submitBtn = document.getElementById('submitBtn');
    var noInput   = document.getElementById('noInput');
    var noError   = document.getElementById('noError');
    var rangeHint = document.getElementById('rangeHint');
    var seg       = document.getElementById('genderSeg');
    var pick      = document.getElementById('statusPick');
    var memoInput = document.getElementById('memoInput');
    var memoCount = document.getElementById('memoCount');
    var photoList = document.getElementById('photoList');
    var photoInput = document.getElementById('photoInput');
    var photoCount = document.getElementById('photoCount');
    var toastEl   = document.getElementById('toast');

    var MAX_PHOTOS = 5;
    var draft = { g: 'm', no: null, s: null, photos: [] };
    var toastTimer;

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('is-on');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.classList.remove('is-on'); }, 2400);
    }

    function syncGender() {
      seg.querySelectorAll('button').forEach(function (b) {
        b.setAttribute('aria-pressed', String(b.dataset.g === draft.g));
      });
      rangeHint.textContent = '1 – ' + TOTAL[draft.g];
    }

    function syncStatus() {
      pick.querySelectorAll('button').forEach(function (b) {
        b.setAttribute('aria-pressed', String(b.dataset.s === draft.s));
      });
    }

    function validate() {
      var max = TOTAL[draft.g];
      var raw = noInput.value;
      var n = parseInt(raw, 10);
      var valid = raw !== '' && !isNaN(n) && n >= 1 && n <= max;

      draft.no = valid ? n : null;

      if (raw !== '' && !valid) {
        noError.textContent = GENDER[draft.g] + ' 키는 1번부터 ' + max + '번까지 있어요';
        noError.classList.add('is-on');
      } else {
        noError.classList.remove('is-on');
      }
      submitBtn.disabled = !(valid && draft.s);
    }

    function fitMemo() {
      memoInput.style.height = 'auto';
      memoInput.style.height = memoInput.scrollHeight + 'px';
    }

    /* ---------- 사진 ---------- */
    var ADD_BTN =
      '<button class="photo-add pressable" type="button" id="photoAdd">' +
        '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
        'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M12 6v12M6 12h12"/></svg>추가</button>';

    function renderPhotos() {
      var html = draft.photos.map(function (src, i) {
        return '<button class="photo-thumb" type="button" data-photo="' + i + '" aria-label="사진 ' + (i + 1) + ' 지우기">' +
                 '<img src="' + src + '" alt="">' +
                 '<span class="x">' +
                   '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
                   'stroke-width="3.2" stroke-linecap="round" aria-hidden="true">' +
                   '<path d="M6 6l12 12M18 6L6 18"/></svg>' +
                 '</span>' +
               '</button>';
      }).join('');

      if (draft.photos.length < MAX_PHOTOS) html += ADD_BTN;
      photoList.innerHTML = html;
      photoCount.textContent = draft.photos.length;

      var add = document.getElementById('photoAdd');
      if (add) add.addEventListener('click', function () { photoInput.click(); });

      photoList.querySelectorAll('[data-photo]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          askDelete(parseInt(btn.dataset.photo, 10));
        });
      });
    }

    /* 원본 그대로 저장하면 저장 공간이 금방 찬다 — 1024px·품질 0.7로 줄인다 */
    function shrink(file, done) {
      var reader = new FileReader();
      reader.onload = function (e) {
        var img = new Image();
        img.onload = function () {
          var max = 1024, w = img.width, h = img.height;
          if (w > max || h > max) {
            var r = Math.min(max / w, max / h);
            w = Math.round(w * r);
            h = Math.round(h * r);
          }
          var cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          cv.getContext('2d').drawImage(img, 0, 0, w, h);
          done(cv.toDataURL('image/jpeg', 0.7));
        };
        img.onerror = function () { done(null); };
        img.src = e.target.result;
      };
      reader.onerror = function () { done(null); };
      reader.readAsDataURL(file);
    }

    photoInput.addEventListener('change', function () {
      var files = Array.prototype.slice.call(photoInput.files || []);
      var room = MAX_PHOTOS - draft.photos.length;
      if (files.length > room) {
        toast('사진은 최대 ' + MAX_PHOTOS + '장까지 넣을 수 있어요');
        files = files.slice(0, room);
      }
      var left = files.length;
      if (!left) { photoInput.value = ''; return; }

      files.forEach(function (f) {
        shrink(f, function (src) {
          if (src) draft.photos.push(src);
          if (--left === 0) { renderPhotos(); photoInput.value = ''; }
        });
      });
    });

    /* ==========================================================
       사진 크게 보기
       ========================================================== */
    var viewer      = document.getElementById('viewer');
    var viewerImg   = document.getElementById('viewerImg');
    var viewerCount = document.getElementById('viewerCount');
    var viewerNav   = document.getElementById('viewerNav');
    var viewerPrev  = document.getElementById('viewerPrev');
    var viewerNext  = document.getElementById('viewerNext');

    var viewList = [];
    var viewIdx  = 0;

    function showPhoto() {
      viewerImg.src = viewList[viewIdx];
      viewerCount.textContent = (viewIdx + 1) + ' / ' + viewList.length;
      viewerPrev.disabled = viewIdx === 0;
      viewerNext.disabled = viewIdx === viewList.length - 1;
    }

    function openViewer(list, i) {
      if (!list || !list.length) return;
      viewList = list;
      viewIdx  = i > 0 ? i : 0;
      viewerNav.hidden = list.length < 2;   /* 한 장뿐이면 넘길 것이 없다 */
      showPhoto();
      viewer.classList.add('is-open');
      viewer.setAttribute('aria-hidden', 'false');
    }

    function closeViewer() {
      viewer.classList.remove('is-open');
      viewer.setAttribute('aria-hidden', 'true');
    }

    document.getElementById('viewerBack').addEventListener('click', closeViewer);
    viewerPrev.addEventListener('click', function () {
      if (viewIdx > 0) { viewIdx--; showPhoto(); }
    });
    viewerNext.addEventListener('click', function () {
      if (viewIdx < viewList.length - 1) { viewIdx++; showPhoto(); }
    });

    /* ---------- 삭제 확인 ---------- */
    var dlg = document.getElementById('dlg');
    var dlgScrim = document.getElementById('dlgScrim');
    var pendingIndex = null;

    function askDelete(i) {
      pendingIndex = i;
      dlgScrim.classList.add('is-open');
      dlg.classList.add('is-open');
    }
    function closeDialog() {
      dlgScrim.classList.remove('is-open');
      dlg.classList.remove('is-open');
      pendingIndex = null;
    }

    document.getElementById('dlgYes').addEventListener('click', function () {
      if (pendingIndex !== null) {
        draft.photos.splice(pendingIndex, 1);
        renderPhotos();
        toast('사진을 지웠어요');
      }
      closeDialog();
    });
    document.getElementById('dlgNo').addEventListener('click', closeDialog);
    dlgScrim.addEventListener('click', closeDialog);

    function openSheet(presetG, presetNo) {
      draft = { g: presetG || 'm', no: null, s: null, photos: [] };
      noInput.value = presetNo ? String(presetNo) : '';
      memoInput.value = '';
      memoInput.style.height = '';
      memoCount.textContent = '0';
      photoInput.value = '';
      noError.classList.remove('is-on');
      syncGender(); syncStatus(); validate(); renderPhotos();
      scrim.classList.add('is-open');
      sheet.classList.add('is-open');
    }

    function closeSheet() {
      scrim.classList.remove('is-open');
      sheet.classList.remove('is-open');
      noInput.blur();
    }

    openBtn.addEventListener('click', function () { openSheet(); });
    closeBtn.addEventListener('click', closeSheet);
    scrim.addEventListener('click', closeSheet);
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (sheet.classList.contains('is-open')) closeSheet();
      else if (detail.classList.contains('is-open')) closeDetail();
    });

    noInput.addEventListener('input', function () {
      var only = noInput.value.replace(/[^0-9]/g, '').slice(0, 3);
      if (only !== noInput.value) noInput.value = only;
      validate();
    });

    memoInput.addEventListener('input', function () {
      memoCount.textContent = memoInput.value.length;
      fitMemo();
    });

    seg.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-g]');
      if (!b) return;
      draft.g = b.dataset.g;
      syncGender();
      validate();
    });

    pick.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-s]');
      if (!b) return;
      draft.s = b.dataset.s;
      syncStatus();
      validate();
    });

    submitBtn.addEventListener('click', function () {
      if (submitBtn.disabled) return;
      var g = draft.g, no = draft.no, s = draft.s;
      var memo = memoInput.value.trim();
      var photos = draft.photos.slice();

      if (s === 'ok') delete data[g][no];
      else data[g][no] = { s: s, memo: memo, photos: photos };

      data.log.unshift({ g: g, no: no, s: s, memo: memo, at: new Date().toISOString() });
      data.log = data.log.slice(0, 30);

      var saved = persist();
      render();
      if (detailG) renderDetail(detailG);
      closeSheet();

      if (saved) {
        toast(GENDER[g] + ' ' + pad(no) + '번을 ' + STATUS[s] + '으로 등록했어요');
      } else {
        toast('저장 공간이 가득 찼어요. 사진을 줄여주세요');
      }
    });

    render();
  })();
</script>

</body>
</html>
